proxy: ""                    # 出口代理
web_host: 0.0.0.0          # 服务监听地址
web_uc_host: localhost       # Artifacts 沙箱 Host 这里反代要两个域名，和主域名不同
admin_password: claude2api   # 管理密码
status_check_seconds: 21600  # 监测间隔
retry_count: 0               # 重试次数
delete_chat: true            # 删除会话
max_history_length: 12000    # 附件阈值
remove_invalid_account: false # 自动移除会话失效的账号
detailed_api_log: true       # 记录完整 API 请求与输出
# Optional. Override Claude.ai web slugs when they differ from the public API id.
# Keys are canonical public ids (e.g. claude-opus-5-5). Uncomment only if a live
# account rejects the built-in defaults (currently the same as the public ids).
# claude_ai_model_ids:
#   claude-opus-5-5: claude-opus-5-5
#   claude-sonnet-5-5: claude-sonnet-5-5
